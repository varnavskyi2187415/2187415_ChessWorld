version: "3.2"
services:
  nestjs_api:
    build:
      dockerfile: ./docker/room-service/Dockerfile
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./room-service:/usr/src/app/
    networks:
      - app-network

  express-gateway:
    build:
      dockerfile: ./docker/express-gateway/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./express-gateway/config:/usr/src/app/config
    depends_on:
      - nestjs_api
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - express-gateway
      - nestjs_api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
