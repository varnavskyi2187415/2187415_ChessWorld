version: "3.2"
services:
  room-service:
    build:
      dockerfile: ./docker/room-service/Dockerfile
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./room-service:/usr/src/app/
    networks:
      - app-network

  auth-service:
    build:
      dockerfile: docker/auth-service/Dockerfile
    container_name: 'auth-service'
    volumes:
      - ./auth-service/config:/usr/src/app/config
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - room-service
      - auth-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
